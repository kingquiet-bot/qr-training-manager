name: Build Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: qr-training-manager:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm -d --name test-container -p 5000:5000 qr-training-manager:latest
        sleep 5
        curl -f http://localhost:5000 || exit 1
        docker stop test-container

    - name: Display Docker image info
      run: |
        docker images qr-training-manager:latest
        echo "Docker image built successfully!"
        echo "To push to Docker Hub:"
        echo "  docker login"
        echo "  docker tag qr-training-manager:latest yourusername/qr-training-manager:latest"
        echo "  docker push yourusername/qr-training-manager:latest"
